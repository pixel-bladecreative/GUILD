<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flex Payment ad</title>
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="ad.css">
</head>
<body>
<div class="ad" id="ad"></div>
<script>
// Usage: ad.html?angle=brand&w=1080&h=1350   (or &logo=1 for logo-only assets)
(async () => {
  const q = new URLSearchParams(location.search);
  const w = +q.get("w") || 1080, h = +q.get("h") || 1080;
  const root = document.documentElement;
  root.style.setProperty("--w", w + "px");
  root.style.setProperty("--h", h + "px");
  root.style.setProperty("--u", Math.min(w, h) / 100 + "px");
  const ad = document.getElementById("ad");
  const logoSrc = "../brand/assets/logo-guild-flex-payment.png";

  if (q.get("logo")) {
    ad.classList.add("logo-only");
    ad.innerHTML = `<img class="logo" src="${logoSrc}" alt="Guild Mortgage Flex Payment">`;
  } else {
    const data = await (await fetch("../copy/angles.json")).json();
    const a = data.angles.find(x => x.id === (q.get("angle") || "brand"));
    const ratio = w / h;
    const layout = ratio > 1.3 ? "landscape" : ratio < 0.65 ? "tall" : "portrait";
    ad.classList.add(layout);
    if (layout === "portrait" && ratio > 0.9) ad.classList.add("sq");
    const legal = data.legal_short + (a.needs_payment_disclaimer ? " " + data.legal_payments : "");
    // Highlight the last 1-2 words of the headline with the yellow marker
    const words = a.static.headline.split(" ");
    const n = words.length > 4 ? 2 : 1;
    const hl = words.slice(0, -n).join(" ") + " <em>" + words.slice(-n).join(" ") + "</em>";
    // Per-photo framing. bakedTri: the photo already contains the yellow triangle.
    const PH = { "hero-beach-couple.jpg": { pos: "20% 75%", zoom: 1.45, bakedTri: true },
                 "hiking-group.jpg": { pos: "35% 40%", zoom: 1 },
                 "friends-laughing.jpg": { pos: "50% 40%", zoom: 1 },
                 "family-selfie.jpg": { pos: "50% 35%", zoom: 1 } }[a.photo] || { pos: "50% 50%", zoom: 1 };
    const zoom = layout === "landscape" ? Math.min(PH.zoom, 1.15) : PH.zoom;
    if (PH.bakedTri) ad.classList.add("baked-tri");
    ad.innerHTML = `
      <div class="photo"><img src="../brand/assets/photos/${a.photo}" style="object-position:${PH.pos};transform-origin:${PH.pos};transform:scale(${zoom})" alt=""></div>
      <div class="tri"></div>
      <div class="panel">
        <div class="kicker"><span>${a.static.kicker}</span><span class="arrow"></span></div>
        <div class="headline">${hl}</div>
        <div class="sub">${a.static.sub}</div>
        <div class="cta">${a.static.cta}<span class="chev"></span></div>
      </div>
      <div class="footer">
        <img class="logo" src="${logoSrc}" alt="Guild Mortgage Flex Payment">
        <div class="legal">${legal}</div>
      </div>`;
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => (i.onload = i.onerror = r))));
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
